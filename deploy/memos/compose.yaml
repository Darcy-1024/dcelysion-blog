# Formal instance; installation was authorized on 2026-10-20.
name: dcelysion-memos
services:
  memos:
    image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:${MEMOS_HOST_PORT:-5231}:5230"
    environment:
      TZ: Asia/Shanghai
      MEMOS_PORT: "5230"
      MEMOS_DRIVER: sqlite
      MEMOS_DATA: /var/opt/memos
    volumes:
      - type: bind
        source: ./data
        target: /var/opt/memos
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
