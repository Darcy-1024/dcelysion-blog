# Only collection is public. Administration requires a loopback SSH tunnel.
server {
    listen 80;
    listen [::]:80;
    server_name stats.dcelysion.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/dcelysion/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.dcelysion.cn;
    ssl_certificate /etc/letsencrypt/live/stats.dcelysion.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.dcelysion.cn/privkey.pem;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    proxy_set_header Host stats.dcelysion.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /script.js {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18300;
    }
    location = /api/send {
        # OPTIONS is required for cross-origin collection.
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18300;
    }
    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:18300;
    }
}
