# Keep loopback-only until ICP approval and final public cutover.
limit_req_zone $binary_remote_addr zone=dcelysion_auth:1m rate=6r/m;
# Only the SSH preview uses the local tunnel API; HTTPS keeps its public origin.
map $server_port $dcelysion_admin_api {
    default https://comments.dcelysion.cn/api/;
    8361 http://127.0.0.1:18360/api/;
}
# Waline chooses registration email text from the POST /api/user lang query.
# Keep query parameters intact for other methods on the same endpoint.
map $request_method $dcelysion_user_query {
    default $is_args$args;
    POST ?lang=zh-CN;
}
server {
    listen 127.0.0.1:8443 ssl;
    listen 127.0.0.1:8361;
    server_name comments.dcelysion.cn;
    ssl_certificate /etc/letsencrypt/live/comments.dcelysion.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comments.dcelysion.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # The pre-1.41.6 reset route sent a permanent login JWT. Keep it closed
    # even during image rollout or a manual service rollback.
    location = /api/user/password {
        return 410;
    }
    location = /api/user {
        limit_req zone=dcelysion_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8360/api/user$dcelysion_user_query;
    }
    location ~ ^/api/(user|token)(/|$) {
        limit_req zone=dcelysion_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8360;
    }
    location ~ ^/api/password-reset/(request|confirm)$ {
        limit_req zone=dcelysion_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8362;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /ui/forgot {
        default_type text/html;
        charset utf-8;
        alias /srv/dcelysion/admin-assets/reset-v1/forgot.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
    }
    location = /ui/reset-password {
        default_type text/html;
        charset utf-8;
        alias /srv/dcelysion/admin-assets/reset-v1/reset-password.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
    }
    location ^~ /ui/ {
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8360;
        # Waline admin normalizes input line-height to 1.15; use the body line-height for login fields.
        sub_filter '</head>' '<style>.typecho-login input.text-l { line-height: 1.5; }</style><script defer src="/admin-assets/show-password-v1.js"></script></head>';
        sub_filter "window.serverURL = 'https://comments.dcelysion.cn/api/'" "window.serverURL = '$dcelysion_admin_api'";
        sub_filter_once on;
    }
    location ^~ /admin-assets/ {
        alias /srv/dcelysion/admin-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location / { proxy_pass http://127.0.0.1:8360; }
}
