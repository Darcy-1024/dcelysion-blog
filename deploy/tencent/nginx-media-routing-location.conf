# Include only inside the authorized HTTPS virtual host. No alias/static private roots.
location ^~ /media/ {
    limit_req zone=media_route_request burst=4 nodelay;
    limit_req_status 503;
    limit_conn media_route_connections 16;
    limit_conn_status 503;
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
