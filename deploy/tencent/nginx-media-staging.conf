# Private media verification endpoint; preserve each production host's object key.
map $host $dcelysion_media_bucket {
    default "";
    music.dcelysion.cn music;
    wallpapers.dcelysion.cn wallpapers;
    gallery.dcelysion.cn gallery;
}
server {
    listen 127.0.0.1:8081;
    server_name music.dcelysion.cn wallpapers.dcelysion.cn gallery.dcelysion.cn;
    root /srv/dcelysion/media/$dcelysion_media_bucket;
    include /etc/nginx/mime.types;
    types { audio/flac flac; }
    server_tokens off;
    autoindex off;
    if ($dcelysion_media_bucket = "") { return 404; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header Cache-Control "public, max-age=86400";
    if ($request_method = OPTIONS) { return 204; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
