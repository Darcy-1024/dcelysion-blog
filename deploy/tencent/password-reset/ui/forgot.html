<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>忘记密码 · DcElysion</title>
  <link rel="stylesheet" href="/admin-assets/reset-v1/reset.css">
  <script defer src="/admin-assets/reset-v1/reset.js"></script>
</head>
<body data-page="forgot">
  <main>
    <a href="/ui/login" data-i18n="back">返回登录</a>
    <h1 data-i18n="forgotTitle">找回密码</h1>
    <p data-i18n="forgotHelp">输入注册邮箱，我们会发送一封验证邮件。</p>
    <form id="forgot-form">
      <label for="email" data-i18n="email">邮箱地址</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
      <button type="submit" data-i18n="send">发送重置邮件</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
