<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>设置新密码 · DcElysion</title>
  <link rel="stylesheet" href="/admin-assets/reset-v1/reset.css">
  <script defer src="/admin-assets/reset-v1/reset.js"></script>
</head>
<body data-page="reset">
  <main>
    <a href="/ui/login" data-i18n="back">返回登录</a>
    <h1 data-i18n="resetTitle">设置新密码</h1>
    <p data-i18n="passwordHelp">密码至少 12 个字符，最多 1024 个字符。</p>
    <form id="reset-form">
      <label for="password" data-i18n="password">新密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
      <label for="confirm" data-i18n="confirm">确认新密码</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
      <label class="toggle"><input id="show-password" type="checkbox"><span data-i18n="show">显示密码</span></label>
      <button type="submit" data-i18n="save">保存新密码</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/ui/forgot" data-i18n="applyAgain">重新申请链接</a>
  </main>
</body>
</html>
