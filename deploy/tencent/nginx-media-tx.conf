# Independent Tencent origin. Only explicitly indexed public objects are served.
limit_req_zone $binary_remote_addr zone=media_tx_request:1m rate=2r/s;
limit_conn_zone $server_name zone=media_tx_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name media-tx.dcelysion.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/dcelysion/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media-tx.dcelysion.cn;
    ssl_certificate /etc/letsencrypt/live/media-tx.dcelysion.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-tx.dcelysion.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    if ($host != media-tx.dcelysion.cn) { return 421; }
    location ^~ /media/ {
        limit_req zone=media_tx_request burst=4 nodelay;
        limit_req_status 503;
        limit_conn media_tx_connections 16;
        limit_conn_status 503;
        # Fixed IP on the stage3 Docker internal bridge; no host port is published.
        proxy_pass http://172.23.0.2:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
