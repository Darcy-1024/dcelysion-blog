# Include these zones in http{}, this location in the chosen HTTPS blog/media host.
# Existing HTML/API/comments locations are unchanged. Never serve upload/private roots.
limit_req_zone $binary_remote_addr zone=media_route_request:1m rate=2r/s;
limit_conn_zone $server_name zone=media_route_connections:1m;

