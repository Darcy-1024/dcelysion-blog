# No public website or API before ICP approval. Only ACME validation is exposed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name comments.dcelysion.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/dcelysion/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
