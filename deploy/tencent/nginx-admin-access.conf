# Only cloudflared and an authenticated SSH operator can reach this listener.
# The Tunnel MUST validate the Access JWT for the whole admin hostname.
# Formal container uses this reserved internal IP; verify it before nginx reload.
# Do not publish the backend port on the public interface.
server {
    listen 127.0.0.1:18445;
    server_name admin.dcelysion.cn;
    access_log off;
    # OAuth state can contain a bearer token; routine rate-limit logs include URLs.
    error_log /var/log/nginx/dc-admin-stage2-error.log crit;
    client_max_body_size 128m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    if ($host != admin.dcelysion.cn) { return 421; }
    location = /waline-api/user/password { return 410; }
    location ~ ^/waline-api/(token|password-reset/(request|confirm))$ {
        limit_req zone=dcelysion_auth burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/waline-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8360;
        proxy_set_header Host comments.dcelysion.cn;
        proxy_set_header Origin https://comments.dcelysion.cn;
        proxy_set_header Referer https://comments.dcelysion.cn/ui/;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /waline-api/ {
        proxy_pass http://127.0.0.1:8360/api/;
        proxy_set_header Host comments.dcelysion.cn;
        proxy_set_header Origin https://comments.dcelysion.cn;
        proxy_set_header Referer https://comments.dcelysion.cn/ui/;
        proxy_set_header X-Forwarded-Proto https;
        # Keep the provider request/state unchanged; route its callback through Access.
        proxy_redirect ~^(https://oauth\.lithub\.cc/[^?]+\?redirect=)https%3A%2F%2Fcomments\.dcelysion\.cn%2Fapi%2Foauth(.*)$ $1https%3A%2F%2Fadmin.dcelysion.cn%2Fwaline-api%2Foauth$2;
    }
    location /ui/ {
        proxy_pass http://127.0.0.1:8360;
        proxy_set_header Host comments.dcelysion.cn;
        proxy_set_header Accept-Encoding "";
        sub_filter "window.serverURL = 'https://comments.dcelysion.cn/api/'" "window.serverURL = 'https://admin.dcelysion.cn/waline-api/'";
        sub_filter '</head>' '<script defer src="/admin-assets/avatar-upload-v1.js"></script></head>';
        sub_filter_once on;
    }
    location /admin-assets/ {
        alias /srv/dcelysion/admin-assets/;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://172.18.0.7:4322;
        proxy_set_header Host admin.dcelysion.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
