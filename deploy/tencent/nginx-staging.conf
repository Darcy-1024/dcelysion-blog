# Private staging endpoint, reached through an SSH tunnel only.
# The production HTTPS virtual hosts are installed after data and TLS verification.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /srv/dcelysion/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Preview-only substitution; production HTML keeps the HTTPS service URL.
    sub_filter 'https://comments.dcelysion.cn' 'http://127.0.0.1:18360';
    sub_filter_once off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ (^|/)\. {
        deny all;
    }

    location ^~ /server/ {
        return 404;
    }
}
