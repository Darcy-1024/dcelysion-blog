# Private loopback TLS ingress; use existing certificate and an SSH tunnel.
# Example only; replace certificate paths before nginx -t. Do not enable public listen.
server {
    listen 127.0.0.1:8444 ssl;
    server_name admin.example.invalid;
    ssl_certificate /etc/dcelysion/certs/admin/fullchain.pem;
    ssl_certificate_key /etc/dcelysion/certs/admin/privkey.pem;
    client_max_body_size 128m;
    access_log off; # Avoid private content paths / identifiers in shared access logs.
    error_log /var/log/nginx/dc-admin-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host admin.example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
